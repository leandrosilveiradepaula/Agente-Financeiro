name: Demo Shadow transport offline

on:
  pull_request:
    branches: [demo/grupo-horizonte]
    paths:
      - "lib/langgraph-shadow-client.ts"
      - "tests/langgraph-shadow-client.test.ts"
      - "docs/shadow-parallel-n8n-g1.md"
      - "app/api/generate-sql/route.ts"
      - "app/api/llm-models/route.ts"
      - "lib/shadow-phase-gate.ts"
      - "tests/shadow-preactivation-diagnostics.test.ts"
      - "tests/langgraph-shadow-read-client.test.ts"
      - "tests/agent-diagnostics-panel.test.tsx"
      - "components/AgentDiagnosticsPanel.tsx"
      - "app/api/admin/orchestration-diagnostics/route.ts"
      - "lib/langgraph-shadow-read-client.ts"
      - "tests/shadow-phase-gate.test.ts"
      - "tests/langgraph-shadow-route-behavior.test.ts"
      - "tests/langgraph-shadow-routes.test.ts"
      - "tests/langgraph-shadow-admin-routes.test.ts"
      - "tests/demo-interface-contract.test.ts"
      - ".env.example"
      - "lib/shadow-parity-batch.ts"
      - "app/api/admin/runs/parity-review/route.ts"
      - "app/admin/runs/parity-review/page.tsx"
      - "app/admin/runs/page.tsx"
      - "tests/shadow-parity-batch.test.ts"
      - "tests/shadow-parity-batch-route.test.ts"
      - "app/api/admin/candidate-generate/route.ts"
      - "app/admin/candidate-generate/page.tsx"
      - "tests/candidate-generate-route.test.ts"
      - "lib/candidate-sql-review.ts"
      - "tests/candidate-sql-review.test.ts"
      - "app/api/admin/candidate-reviews/[id]/route.ts"
      - "app/admin/candidate-reviews/[id]/page.tsx"
      - "app/api/execute-watson/route.ts"
      - "app/admin/runs/page.tsx"
      - ".github/workflows/demo-shadow-transport-offline.yml"
  push:
    branches: [demo/grupo-horizonte]
    paths:
      - "lib/langgraph-shadow-client.ts"
      - "tests/langgraph-shadow-client.test.ts"
      - "app/api/generate-sql/route.ts"
      - "app/api/llm-models/route.ts"
      - "lib/shadow-phase-gate.ts"
      - "tests/shadow-preactivation-diagnostics.test.ts"
      - "tests/langgraph-shadow-read-client.test.ts"
      - "tests/agent-diagnostics-panel.test.tsx"
      - "components/AgentDiagnosticsPanel.tsx"
      - "app/api/admin/orchestration-diagnostics/route.ts"
      - "lib/langgraph-shadow-read-client.ts"
      - "tests/shadow-phase-gate.test.ts"
      - "tests/langgraph-shadow-route-behavior.test.ts"
      - "tests/langgraph-shadow-routes.test.ts"
      - "tests/langgraph-shadow-admin-routes.test.ts"
      - "tests/demo-interface-contract.test.ts"
      - "docs/shadow-parallel-n8n-g1.md"
      - ".env.example"
      - "lib/shadow-parity-batch.ts"
      - "app/api/admin/runs/parity-review/route.ts"
      - "app/admin/runs/parity-review/page.tsx"
      - "app/admin/runs/page.tsx"
      - "tests/shadow-parity-batch.test.ts"
      - "tests/shadow-parity-batch-route.test.ts"
      - "app/api/admin/candidate-generate/route.ts"
      - "app/admin/candidate-generate/page.tsx"
      - "tests/candidate-generate-route.test.ts"
      - "lib/candidate-sql-review.ts"
      - "tests/candidate-sql-review.test.ts"
      - "app/api/admin/candidate-reviews/[id]/route.ts"
      - "app/admin/candidate-reviews/[id]/page.tsx"
      - "app/api/execute-watson/route.ts"
      - "app/admin/runs/page.tsx"
      - ".github/workflows/demo-shadow-transport-offline.yml"

permissions:
  contents: read

jobs:
  shadow-transport:
    name: Demo Shadow transport contract and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without optional external calls
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Isolated n8n / relay / direct Shadow contract tests
        run: npm test -- tests/langgraph-shadow-client.test.ts tests/langgraph-shadow-route-behavior.test.ts tests/shadow-phase-gate.test.ts tests/llm-provider-registry.test.ts
      - name: Complete offline unit and route regression
        run: npm test
